# /etc/nginx/sites-available/podium  ->  podium.siem.codes
# Behind the shared siem-auth gate, same as hutwatcher and the others.
limit_req_zone $binary_remote_addr zone=podium_general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=podium_conn:10m;

server {
    listen 8080;
    server_name podium.siem.codes;
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    client_max_body_size 16k;
    keepalive_timeout 15;
    limit_conn podium_conn 20;
    limit_req zone=podium_general burst=30 nodelay;

    include snippets/siem-auth.conf;

    location / {
        auth_request /__siem_auth;
        error_page 401 = @siem_login;

        proxy_pass http://127.0.0.1:5011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Protocol "";
        proxy_set_header X-Forwarded-Ssl "";
        proxy_set_header X-Siem-Auth "1";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
}
